<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found — Hussnain Ansari Portfolio</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #F8F7F3;
        color: #111827;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      .card {
        background: #ffffff;
        border: 1px solid rgba(14, 23, 48, 0.12);

        padding: 40px 32px;
        max-width: 480px;
        margin: 20px;
        box-shadow: 0 4px 20px rgba(14, 23, 48, 0.04);
      }
      h1 {
        font-size: 28px;
        margin: 0 0 12px;
        color: #0E1730;
      }
      p {
        font-size: 15px;
        line-height: 1.5;
        color: #4B5563;
        margin: 0 0 24px;
      }
      a.btn {
        display: inline-block;
        background: #002B97;
        color: #ffffff;
        text-decoration: none;
        padding: 10px 20px;
        border-radius: 4px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        transition: background 0.15s ease;
      }
      a.btn:hover {
        background: #0E1730;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div style="font-family: monospace; font-size: 12px; color: #002B97; font-weight: 700; margin-bottom: 8px; letter-spacing: 1px;">
